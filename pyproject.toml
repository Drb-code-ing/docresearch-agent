[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "docresearch-agent"
version = "0.1.0"
description = "Bounded research agents over local documents with traceable reports"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch[async]>=8.17,<9",
  "httpx>=0.28,<0.29",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "pymilvus>=2.6,<2.7",
  "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
docresearch = "docresearch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
